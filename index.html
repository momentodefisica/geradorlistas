<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listas ENEM — momento de física</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="https://momentodefisica.github.io/" class="logo">← momento de física</a>
    </div>
  </header>

  <main class="container">

    <header class="secao-header">
      <h1>Listas ENEM</h1>
      <p class="lead">
        Selecione os subtemas abaixo e baixe sua lista personalizada em PDF.
      </p>
    </header>

    <div id="carregando" class="aviso">Carregando…</div>
    <div id="arvore" hidden></div>

    <section id="selecionados" hidden>
      <h2>Sua seleção</h2>
      <div id="chips"></div>
      <div class="acoes">
        <button id="btn-gerar" disabled>Baixar lista</button>
        <button id="btn-limpar" class="botao-secundario">Limpar</button>
      </div>
    </section>

  </main>

  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
